name: Actualizar sismos

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede atrasarlo unos minutos)
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/sismos.yml"]

permissions:
  contents: write

concurrency:
  group: sismos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar catálogos
        run: python scripts/fetch_sismos.py
      - name: Guardar si cambió
        run: |
          git config user.name "sismos-bot"
          git config user.email "sismos-bot@users.noreply.github.com"
          git add data/sismos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Sismos $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
